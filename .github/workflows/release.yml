name: Release AppImage

# Push a tag like v0.1.0 and this builds the AppImage, tests it, and attaches
# it to a GitHub release. The version inside hermitcrab/__init__.py must match.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Oldest supported base: the AppImage needs a glibc at least this new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 file desktop-file-utils

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hermitcrab/__init__.py)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != v$v"; exit 1; }

      - name: Validate desktop file
        run: desktop-file-validate packaging/hermitcrab.desktop

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Test the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          img=$(ls dist/*.AppImage)
          "$img" --appimage-extract-and-run --version
          "$img" --appimage-extract-and-run --self-test
          sha256sum "$img" > "$img.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: HermitCrab-AppImage
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "HermitCrab ${GITHUB_REF_NAME}" \
            --notes "Download the .AppImage, make it executable, run it. See the README for details." \
            --prerelease

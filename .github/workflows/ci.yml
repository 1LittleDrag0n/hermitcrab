name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: for f in scripts/*.sh install.sh uninstall.sh packaging/*.sh; do bash -n "$f"; done

      - name: ShellCheck (errors only)
        run: shellcheck --severity=error scripts/*.sh install.sh uninstall.sh packaging/build-appimage.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Python compiles
        run: python -m compileall -q hermitcrab

      - name: Self-test from source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -q "PySide6-Essentials>=6.6,<7"
          python -m hermitcrab --self-test
